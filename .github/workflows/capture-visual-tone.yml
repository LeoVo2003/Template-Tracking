name: Capture visual tone

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum screenshots and tone checks this run"
        required: false
        default: "10"
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: read

jobs:
  capture-and-classify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MAC_TRACKER_SITE_URL: ${{ secrets.MAC_TRACKER_SITE_URL }}
      MAC_TRACKER_AUTOMATION_SECRET: ${{ secrets.MAC_TRACKER_AUTOMATION_SECRET }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      BATCH_LIMIT: ${{ inputs.limit || '10' }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify private workflow configuration
        run: |
          test -n "$MAC_TRACKER_SITE_URL"
          test -n "$MAC_TRACKER_AUTOMATION_SECRET"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install cloud capture dependencies
        run: npm install --no-save playwright@1.57.0 sharp@0.34.5
      - name: Install Chromium on this temporary GitHub runner
        run: npx playwright install --with-deps chromium
      - name: Capture full pages and classify tone
        run: node .github/scripts/capture-visual-tone.mjs
