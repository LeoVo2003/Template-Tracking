name: Capture visual tone

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "targeted or batch"
        required: false
        default: "batch"
      stage:
        description: "capture, tone, full, or auto"
        required: false
        default: "full"
      target_ids:
        description: "JSON snapshot ID list for a targeted run"
        required: false
        default: "[]"
      limit:
        description: "Maximum logical websites this run"
        required: false
        default: "10"
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: read

# Manual clicks and the twice-hourly schedule may overlap. Keep every run, but
# process them in order so two browsers never work the same queue concurrently.
concurrency:
  group: mac-project-tracker-visual-tone
  cancel-in-progress: false

jobs:
  capture-and-classify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MAC_TRACKER_SITE_URL: ${{ secrets.MAC_TRACKER_SITE_URL }}
      MAC_TRACKER_AUTOMATION_SECRET: ${{ secrets.MAC_TRACKER_AUTOMATION_SECRET }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Safety policy: this workflow never selects a paid provider/model.
      FREE_ONLY: "true"
      WORKFLOW_EVENT: ${{ github.event_name }}
      RUN_MODE: ${{ inputs.run_mode || 'batch' }}
      VISUAL_STAGE: ${{ inputs.stage || 'full' }}
      TARGET_IDS: ${{ inputs.target_ids || '[]' }}
      BATCH_LIMIT: ${{ inputs.limit || '10' }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify private workflow configuration
        run: |
          test -n "$MAC_TRACKER_SITE_URL"
          test -n "$MAC_TRACKER_AUTOMATION_SECRET"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install cloud capture dependencies
        run: npm install --no-save playwright@1.57.0 sharp@0.34.5
      - name: Install Chromium on this temporary GitHub runner
        run: npx playwright install --with-deps chromium
      - name: Capture full pages and classify tone
        run: node .github/scripts/capture-visual-tone.mjs
